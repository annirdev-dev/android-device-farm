apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: devicefarm
spec:
  replicas: 2
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web } }
    spec:
      containers:
        - name: web
          image: ghcr.io/your-org/devicefarm-web:latest
          ports: [{ containerPort: 3000 }]
          env:
            - { name: NEXT_PUBLIC_API_URL, value: "https://api.devicefarm.example.com" }
            - { name: NEXT_PUBLIC_STREAMING_GATEWAY_URL, value: "wss://stream.devicefarm.example.com" }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: devicefarm
spec:
  selector: { app: web }
  ports: [{ port: 80, targetPort: 3000 }]
