apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: devicefarm
spec:
  replicas: 2
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api } }
    spec:
      containers:
        - name: api
          image: ghcr.io/your-org/devicefarm-api:latest
          ports: [{ containerPort: 4000 }]
          envFrom:
            - configMapRef: { name: devicefarm-config }
            - secretRef: { name: devicefarm-secrets }
          readinessProbe:
            httpGet: { path: /health, port: 4000 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 4000 }
            initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: devicefarm
spec:
  selector: { app: api }
  ports: [{ port: 80, targetPort: 4000 }]
